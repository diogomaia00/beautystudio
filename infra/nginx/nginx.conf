upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health probes (infra-level, served by the backend)
    location /healthz {
        proxy_pass http://backend;
    }

    location /readyz {
        proxy_pass http://backend;
    }

    # OpenAPI schema + docs (served by the backend)
    location /api/ {
        proxy_pass http://backend;
    }

    # Back-office API — must come before /bo/ to win the prefix match
    location /bo/v1/ {
        proxy_pass http://backend;
    }

    # Client app API
    location /v1/ {
        proxy_pass http://backend;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend;
    }

    # Django-served static files (whitenoise in prod; fallback in dev)
    location /static/ {
        proxy_pass http://backend;
    }

    # Next.js HMR websocket (dev only; harmless in prod)
    location /_next/webpack-hmr {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    # Everything else → Next.js (client app + /bo/* frontend routes)
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "keep-alive";
    }
}
